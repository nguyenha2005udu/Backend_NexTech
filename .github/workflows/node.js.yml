name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # không hủy deploy đang chạy trên main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm test

  changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
    - uses: actions/checkout@v4
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          identity:     ['services/identity/**',     'packages/**', 'package-lock.json']
          catalog:      ['services/catalog/**',      'packages/**', 'package-lock.json']
          promotion:    ['services/promotion/**',    'packages/**', 'package-lock.json']
          order:        ['services/order/**',        'packages/**', 'package-lock.json']
          notification: ['services/notification/**', 'packages/**', 'package-lock.json']
          assistant:    ['services/assistant/**',    'packages/**', 'package-lock.json']
          gateway:      ['gateway/**',               'packages/**', 'package-lock.json']

  deploy:
    needs: [build, changes]          # build hoặc test lỗi thì không deploy
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
    - name: Trigger Render deploy (${{ matrix.service }})
      run: curl -fsS -X POST "$HOOK"
      env:
        HOOK: ${{ secrets[format('RENDER_HOOK_{0}', matrix.service)] }}
