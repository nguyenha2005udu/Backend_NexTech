# NexTech — chạy toàn hệ thống: `docker compose up -d`
# Không cần .env: giá trị mặc định dev nằm ngay trong file này (guides/NT_Docker_Local_Guide.md).
# Chỉ gateway và công cụ quan sát được mở cổng ra máy (security-policy §3).
# Đã có: hạ tầng (T1.3), gateway (T1.4). 6 service thêm vào theo task của chúng.

# Dùng chung cho các service Node ở các task sau
x-service-defaults: &service-defaults
  restart: unless-stopped
  mem_limit: 256m
  networks: [nextech]

x-common-env: &common-env
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
  RESILIENCE_ENABLED: ${RESILIENCE_ENABLED:-true}
  HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-2000}
  HTTP_RETRIES: ${HTTP_RETRIES:-2}
  CB_VOLUME_THRESHOLD: ${CB_VOLUME_THRESHOLD:-5}
  CB_ERROR_PERCENT: ${CB_ERROR_PERCENT:-50}
  CB_RESET_MS: ${CB_RESET_MS:-10000}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_SSL: "false"
  SEED_DEMO: ${SEED_DEMO:-true}

x-rabbit-env: &rabbit-env
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [nextech]

  redis:
    image: redis:7-alpine
    # Chỉ mở trên máy local cho test:int của identity (Redis thật), không ra mạng ngoài
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [nextech]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [nextech]

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nextech]

  payos-mock:
    build: ./infra/payos-mock
    environment:
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-dev-checksum}
      WEBHOOK_URL: http://api-gateway:8080/api/webhooks/payos
    ports: ["4010:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nextech]

  # Cổng vào duy nhất của API (security-policy §3.2). Service chưa chạy thì trả 503 NT-GW-0503.
  api-gateway:
    <<: *service-defaults
    build: { context: ., dockerfile: gateway/Dockerfile }
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-2000}
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-10000}
      PROXY_TIMEOUT_AI_MS: ${PROXY_TIMEOUT_AI_MS:-80000}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-30}
      RATE_LIMIT_AI_PER_MIN: ${RATE_LIMIT_AI_PER_MIN:-20}
      IDENTITY_SERVICE_URL: http://identity-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      PROMOTION_SERVICE_URL: http://promotion-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      ASSISTANT_SERVICE_URL: http://assistant-service:3007
    healthcheck: &node-health
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  # NT.PROMOTION — mã giảm giá, lượt dùng mã (T2.1). Không mở cổng: chỉ đi qua gateway.
  promotion-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/promotion/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *common-env
      PORT: 3003
      DB_USER: promotion_user
      DB_PASS: promotion_pass
      DB_NAME: promotion_db
      DB_LOGGING: ${DB_LOGGING:-false}
    healthcheck: *node-health

  # NT.IDENTITY — tài khoản, OTP, token, hồ sơ, địa chỉ (T2.2). Không mở cổng: chỉ đi qua gateway.
  # Không depends_on mailpit: SMTP chết thì gửi OTP trả 503, service vẫn chạy.
  identity-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/identity/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *common-env
      PORT: 3001
      DB_USER: identity_user
      DB_PASS: identity_pass
      DB_NAME: identity_db
      DB_LOGGING: ${DB_LOGGING:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USER: no-reply@nextech.local
      MAIL_PASS: dev
      MAIL_REQUIRE_TLS: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dev}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dev}
      GOOGLE_CALLBACK_URL: http://localhost:8080/api/auth/google/callback
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-dev}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-dev}
      FACEBOOK_CALLBACK_URL: http://localhost:8080/api/auth/facebook/callback
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:3000}
    healthcheck: *node-health

networks:
  nextech:
    name: nextech          # tên cố định, để k6 chạy cùng mạng

volumes:
  pgdata:
