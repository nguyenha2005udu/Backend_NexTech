# NexTech — chạy toàn hệ thống: `docker compose up -d`
# Không cần .env: giá trị mặc định dev nằm ngay trong file này (guides/NT_Docker_Local_Guide.md).
# Chỉ gateway và công cụ quan sát được mở cổng ra máy (security-policy §3).
# Đã có: hạ tầng (T1.3), gateway (T1.4), promotion (T2.1), identity (T2.2), catalog (T2.3),
# khung order, notification, assistant (T1.6).

# Dùng chung cho các service Node ở các task sau
x-service-defaults: &service-defaults
  restart: unless-stopped
  mem_limit: 256m
  networks: [nextech]

x-common-env: &common-env
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
  RESILIENCE_ENABLED: ${RESILIENCE_ENABLED:-true}
  HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-2000}
  HTTP_RETRIES: ${HTTP_RETRIES:-2}
  CB_VOLUME_THRESHOLD: ${CB_VOLUME_THRESHOLD:-5}
  CB_ERROR_PERCENT: ${CB_ERROR_PERCENT:-50}
  CB_RESET_MS: ${CB_RESET_MS:-10000}
  # Mặc định chung cho mọi service. Khối từng service đặt lại DB_* từ <SERVICE>_DB_* (DB cloud riêng từng service),
  # thiếu thì rơi về đây rồi về Postgres trong Docker. Đặt DB_HOST cloud mà không đặt <SERVICE>_DB_USER/PASS là lỗi
  # đăng nhập (mật khẩu dev) — gotchas.md
  DB_HOST: ${DB_HOST:-postgres}
  DB_PORT: ${DB_PORT:-5432}
  DB_SSL: ${DB_SSL:-false}
  SEED_DEMO: ${SEED_DEMO:-true}

x-rabbit-env: &rabbit-env
  RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notification_db"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [nextech]

  redis:
    image: redis:7-alpine
    # Chỉ mở trên máy local cho test:int của identity (Redis thật), không ra mạng ngoài
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [nextech]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: ["15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [nextech]

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    # 1025: SMTP cho service chạy ngoài Docker (npm run dev), chỉ mở trên máy local
    ports: ["8025:8025", "127.0.0.1:1025:1025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nextech]

  payos-mock:
    build: ./infra/payos-mock
    # Mock có thể bị dừng tay khi kiểm chứng "PayOS chết"; sập ngoài ý muốn thì tự chạy lại (NT.PAYMENT v2.7 §5)
    restart: unless-stopped
    environment:
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-dev-checksum}
      WEBHOOK_URL: http://api-gateway:8080/api/webhooks/payos
    ports: ["4010:4010"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4010/').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nextech]

  # FPT AI giả cho assistant-service (NT.ASSISTANT_CHAT §6, ADR-0013): chạy được không cần key thật.
  # Đổi chế độ: curl -X POST localhost:4020/__mock/mode -d '{"mode":"down"}'
  ai-mock:
    build: ./infra/ai-mock
    restart: unless-stopped
    ports: ["4020:4020"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4020/health').then(()=>process.exit(0)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nextech]

  # Cổng vào duy nhất của API (security-policy §3.2). Service chưa chạy thì trả 503 NT-GW-0503.
  api-gateway:
    <<: *service-defaults
    build: { context: ., dockerfile: gateway/Dockerfile }
    ports: ["8080:8080"]
    environment:
      PORT: 8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-2000}
      PROXY_TIMEOUT_MS: ${PROXY_TIMEOUT_MS:-10000}
      PROXY_TIMEOUT_AI_MS: ${PROXY_TIMEOUT_AI_MS:-80000}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-30}
      RATE_LIMIT_AI_PER_MIN: ${RATE_LIMIT_AI_PER_MIN:-20}
      IDENTITY_SERVICE_URL: http://identity-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      PROMOTION_SERVICE_URL: http://promotion-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      ASSISTANT_SERVICE_URL: http://assistant-service:3007
    healthcheck: &node-health
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30

  # NT.CATALOG — sản phẩm, danh mục, ngành hàng (T2.3), giữ kho (T2.4), đánh giá, theo dõi giá (T2.5). Không mở cổng: chỉ đi qua gateway.
  catalog-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/catalog/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *common-env
      PORT: 3002
      # DB riêng của service; đặt CATALOG_DB_* trong .env để dùng DB cloud (không đặt: Postgres trong Docker)
      DB_HOST: ${CATALOG_DB_HOST:-${DB_HOST:-postgres}}
      DB_PORT: ${CATALOG_DB_PORT:-${DB_PORT:-5432}}
      DB_SSL: ${CATALOG_DB_SSL:-${DB_SSL:-false}}
      DB_USER: ${CATALOG_DB_USER:-catalog_user}
      DB_PASS: ${CATALOG_DB_PASS:-catalog_pass}
      DB_NAME: ${CATALOG_DB_NAME:-catalog_db}
      DB_LOGGING: ${DB_LOGGING:-false}
      # Không có key thật: để disabled, upload file trả 503, nhập URL ảnh vẫn dùng được (NT.CATALOG API_Spec §5)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-disabled}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-disabled}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-disabled}
      # Tạo đánh giá hỏi order (đã mua chưa) và identity (tên người viết) — NT.CATALOG API_Spec §3 (T2.5)
      ORDER_SERVICE_URL: http://order-service:3004
      IDENTITY_SERVICE_URL: http://identity-service:3001
      # Cron theo dõi giá, demo đặt "* * * * *" (API_Spec §5)
      PRICE_ALERT_CRON: ${PRICE_ALERT_CRON:-*/10 * * * *}
      # RABBITMQ_URL thêm ở T4.1
    healthcheck: *node-health

  # NT.PROMOTION — mã giảm giá, lượt dùng mã (T2.1). Không mở cổng: chỉ đi qua gateway.
  promotion-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/promotion/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *common-env
      PORT: 3003
      # DB riêng của service; đặt PROMOTION_DB_* trong .env để dùng DB cloud (không đặt: Postgres trong Docker)
      DB_HOST: ${PROMOTION_DB_HOST:-${DB_HOST:-postgres}}
      DB_PORT: ${PROMOTION_DB_PORT:-${DB_PORT:-5432}}
      DB_SSL: ${PROMOTION_DB_SSL:-${DB_SSL:-false}}
      DB_USER: ${PROMOTION_DB_USER:-promotion_user}
      DB_PASS: ${PROMOTION_DB_PASS:-promotion_pass}
      DB_NAME: ${PROMOTION_DB_NAME:-promotion_db}
      DB_LOGGING: ${DB_LOGGING:-false}
    healthcheck: *node-health

  # NT.IDENTITY — tài khoản, OTP, token, hồ sơ, địa chỉ (T2.2). Không mở cổng: chỉ đi qua gateway.
  # Không depends_on mailpit: SMTP chết thì gửi OTP trả 503, service vẫn chạy.
  identity-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/identity/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *common-env
      PORT: 3001
      # DB riêng của service; đặt IDENTITY_DB_* trong .env để dùng DB cloud (không đặt: Postgres trong Docker)
      DB_HOST: ${IDENTITY_DB_HOST:-${DB_HOST:-postgres}}
      DB_PORT: ${IDENTITY_DB_PORT:-${DB_PORT:-5432}}
      DB_SSL: ${IDENTITY_DB_SSL:-${DB_SSL:-false}}
      DB_USER: ${IDENTITY_DB_USER:-identity_user}
      DB_PASS: ${IDENTITY_DB_PASS:-identity_pass}
      DB_NAME: ${IDENTITY_DB_NAME:-identity_db}
      DB_LOGGING: ${DB_LOGGING:-false}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS: ${REDIS_TLS:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-access-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Mặc định Mailpit. SMTP thật (Gmail): đặt MAIL_* trong .env, MAIL_REQUIRE_TLS=true
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USER: ${MAIL_USER:-no-reply@nextech.local}
      MAIL_PASS: ${MAIL_PASS:-dev}
      MAIL_REQUIRE_TLS: ${MAIL_REQUIRE_TLS:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dev}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dev}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:8080/api/auth/google/callback}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-dev}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-dev}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-http://localhost:8080/api/auth/facebook/callback}
      REDIRECT_URI: ${REDIRECT_URI:-http://localhost:3000}
    healthcheck: *node-health

  # Khung T1.6: order, notification, assistant mới có database và /health, chưa có route nghiệp vụ
  # (gọi qua gateway nhận 404 của service). Biến nghiệp vụ thêm ở T3.x, T4.2, T8.5. Không mở cổng.
  order-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/order/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      # Chỉ chờ container khởi động, không chờ healthy: Redis chết thì order vẫn chạy, khoá đơn fail-open (ADR-0015)
      redis: { condition: service_started }
    environment:
      <<: *common-env
      PORT: 3004
      # DB riêng của service; đặt ORDER_DB_* trong .env để dùng DB cloud (không đặt: Postgres trong Docker)
      DB_HOST: ${ORDER_DB_HOST:-${DB_HOST:-postgres}}
      DB_PORT: ${ORDER_DB_PORT:-${DB_PORT:-5432}}
      DB_SSL: ${ORDER_DB_SSL:-${DB_SSL:-false}}
      DB_USER: ${ORDER_DB_USER:-order_user}
      DB_PASS: ${ORDER_DB_PASS:-order_pass}
      DB_NAME: ${ORDER_DB_NAME:-order_db}
      DB_LOGGING: ${DB_LOGGING:-false}
      # Giỏ hàng hỏi catalog (T3.1); identity, promotion dùng từ saga T3.3 — NT.ORDER API_Spec §4.
      # Không depends_on: catalog chết thì giỏ hàng vẫn xem được (degraded).
      IDENTITY_SERVICE_URL: http://identity-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      PROMOTION_SERVICE_URL: http://promotion-service:3003
      # Giá, saga (T3.3 — NT.ORDER API_Spec §4, NT.CHECKOUT_SAGA API_Spec §5)
      SHIPPING_FEE: ${SHIPPING_FEE:-30000}
      FREE_SHIPPING_THRESHOLD: ${FREE_SHIPPING_THRESHOLD:-500000}
      SAGA_BUDGET_MS: ${SAGA_BUDGET_MS:-8000}
      SAGA_DEADLINE_MS: ${SAGA_DEADLINE_MS:-120000}
      # Cron đối soát (T3.5 — NT.CHECKOUT_SAGA Component_Class_Design §7); RESILIENCE_ENABLED=false tắt cron
      SAGA_RECONCILE_INTERVAL_MS: ${SAGA_RECONCILE_INTERVAL_MS:-10000}
      # PayOS (T3.6 — NT.PAYMENT API_Spec §5). Mặc định mock: thiếu PAYOS_BASE_URL thì SDK gọi PayOS THẬT, nên đặt
      # tường minh kể cả khi .env có khoá thật (v2.7). Khoá ký trùng với payos-mock (cùng biến). Không depends_on
      # payos-mock: PayOS chết thì POST /api/payments trả 503 NT-PAY-1006, order vẫn chạy.
      PAYOS_BASE_URL: ${PAYOS_BASE_URL:-http://payos-mock:4010}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-dev}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-dev}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-dev-checksum}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL:-http://localhost:3000/payment/success}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL:-http://localhost:3000/payment/cancel}
      PAYOS_TIMEOUT_MS: ${PAYOS_TIMEOUT_MS:-5000}
      # Redis + khoá đơn có thời hạn (T3.9 — NT.ORDER_HOLD API_Spec §5, BR-20). Dùng chung container với identity,
      # DB 1 ghi cứng để không đụng key của identity (DB 0). .env đặt REDIS_HOST=localhost cho npm run dev thì
      # docker compose up phải ghi đè REDIS_HOST=redis (gotchas.md).
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS: ${REDIS_TLS:-false}
      REDIS_DB: 1
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-200}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
      ORDER_LOCK_TTL_MS: ${ORDER_LOCK_TTL_MS:-10000}
      ORDER_LOCK_WAIT_MS: ${ORDER_LOCK_WAIT_MS:-2000}
      ORDER_LOCK_RETRY_MS: ${ORDER_LOCK_RETRY_MS:-50}
      # lock_timeout, idle_in_transaction_session_timeout của kết nối ứng dụng (BR-20: WAIT + LOCK_TIMEOUT ≤ 3000)
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-1000}
      DB_IDLE_TX_TIMEOUT_MS: ${DB_IDLE_TX_TIMEOUT_MS:-15000}
      # Hạn giữ hàng + job huỷ quá hạn (T3.10 — NT.ORDER_HOLD API_Spec §5, BR-19). Kiểm chứng nhanh: TTL 60000, GRACE 5000
      ORDER_HOLD_TTL_MS: ${ORDER_HOLD_TTL_MS:-900000}
      ORDER_HOLD_GRACE_MS: ${ORDER_HOLD_GRACE_MS:-60000}
      ORDER_HOLD_SWEEP_INTERVAL_MS: ${ORDER_HOLD_SWEEP_INTERVAL_MS:-15000}
      ORDER_HOLD_DB_SWEEP_EVERY: ${ORDER_HOLD_DB_SWEEP_EVERY:-20}
      ORDER_HOLD_BATCH: ${ORDER_HOLD_BATCH:-50}
      ORDER_HOLD_DEFER_BACKOFF_MS: ${ORDER_HOLD_DEFER_BACKOFF_MS:-60000}
      ORDER_HOLD_MAX_DEFER_MS: ${ORDER_HOLD_MAX_DEFER_MS:-600000}
    healthcheck: *node-health

  notification-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/notification/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *common-env
      PORT: 3006
      # DB riêng của service; đặt NOTIFICATION_DB_* trong .env để dùng DB cloud (không đặt: Postgres trong Docker)
      DB_HOST: ${NOTIFICATION_DB_HOST:-${DB_HOST:-postgres}}
      DB_PORT: ${NOTIFICATION_DB_PORT:-${DB_PORT:-5432}}
      DB_SSL: ${NOTIFICATION_DB_SSL:-${DB_SSL:-false}}
      DB_USER: ${NOTIFICATION_DB_USER:-notification_user}
      DB_PASS: ${NOTIFICATION_DB_PASS:-notification_pass}
      DB_NAME: ${NOTIFICATION_DB_NAME:-notification_db}
      DB_LOGGING: ${DB_LOGGING:-false}
    healthcheck: *node-health

  assistant-service:
    <<: *service-defaults
    build: { context: ., dockerfile: services/assistant/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      <<: *common-env
      PORT: 3007
      # DB riêng của service; đặt ASSISTANT_DB_* trong .env để dùng DB cloud (không đặt: Postgres trong Docker)
      DB_HOST: ${ASSISTANT_DB_HOST:-${DB_HOST:-postgres}}
      DB_PORT: ${ASSISTANT_DB_PORT:-${DB_PORT:-5432}}
      DB_SSL: ${ASSISTANT_DB_SSL:-${DB_SSL:-false}}
      DB_USER: ${ASSISTANT_DB_USER:-assistant_user}
      DB_PASS: ${ASSISTANT_DB_PASS:-assistant_pass}
      DB_NAME: ${ASSISTANT_DB_NAME:-assistant_db}
      DB_LOGGING: ${DB_LOGGING:-false}
    healthcheck: *node-health

networks:
  nextech:
    name: nextech          # tên cố định, để k6 chạy cùng mạng

volumes:
  pgdata:
